apiVersion: apps/v1
kind: Deployment
metadata:
  name: elsermanuel-deployment
  namespace: elsermanuel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: elsermanuel
  template:
    metadata:
      labels:
        app: elsermanuel
    spec:
      containers:
      - name: elsermanuel
        image: elsermanuel/elsermanueldocker
        imagePullPolicy: Always
        ports:
        - containerPort: 8081
        env:
        - name: URL_CLOUD
          value: "Bearer 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"  # Añadiendo Bearer aquí
        - name: URL_END
          value: "https://api.groq.com/openai/v1/chat/completions"
        - name: URL_MONGO
          valueFrom:
            secretKeyRef:
              name: elsermanuel-secret
              key: MONGODB_URI
        readinessProbe:
          tcpSocket:
            port: 8081
          initialDelaySeconds: 60
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 8081
          initialDelaySeconds: 90
          periodSeconds: 20